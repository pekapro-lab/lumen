name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - name: Build static SPA for Pages
        run: npx vite build
        env: { GH_PAGES_BASE: /lumen/, VITE_AUTH_ENABLED: "false" }
      - run: cp .vercel/output/static/index.html .vercel/output/static/404.html && touch .vercel/output/static/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: .vercel/output/static }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
